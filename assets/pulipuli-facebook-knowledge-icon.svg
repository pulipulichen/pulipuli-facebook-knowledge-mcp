<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Pulipuli Facebook Knowledge MCP icon">
<defs>
  <linearGradient id="background" x1=".08" y1=".02" x2=".97" y2="1"><stop offset="0" stop-color="#18244f"/><stop offset=".56" stop-color="#142d57"/><stop offset="1" stop-color="#064667"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E1F0FC"/></linearGradient>
  <linearGradient id="fbblue" x1=".1" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#2784F4"/><stop offset="1" stop-color="#0865D2"/></linearGradient>
  <linearGradient id="lens" x1=".18" y1=".1" x2=".92" y2="1"><stop offset="0" stop-color="#156FC9"/><stop offset="1" stop-color="#104783"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".45" stop-color="#FFC457"/><stop offset="1" stop-color="#F49B2E"/></linearGradient>
  <clipPath id="roundbg"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
  <clipPath id="paperclip"><path d="M268 170 H597 L724 297 V744 Q724 791 677 791 H270 Q226 791 226 747 V213 Q226 170 268 170Z"/></clipPath>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="handleShadow" x="-30%" y="-30%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<g clip-path="url(#roundbg)">
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="826" cy="202" r="214" fill="#3496CC" opacity=".115"/>
  <circle cx="162" cy="808" r="262" fill="#86AED9" opacity=".085"/>
  <path d="M-44 444 C186 332 307 394 386 446" fill="none" stroke="#406091" stroke-width="2" opacity=".17"/>
  <circle cx="832" cy="798" r="324" fill="#0A3756" opacity=".13"/>
</g>
<!-- floating social post -->
<path d="M268 189 H597 L724 316 V754 Q724 811 673 811 H271 Q220 811 220 753 V231 Q220 189 268 189Z" fill="#07162C" opacity=".27" filter="url(#softShadow)"/>
<path d="M268 170 H597 L724 297 V744 Q724 791 677 791 H270 Q226 791 226 747 V213 Q226 170 268 170Z" fill="url(#paper)"/>
<g clip-path="url(#paperclip)">
  <rect x="226" y="170" width="500" height="621" fill="url(#paper)"/>
  <!-- subtle FB-colored top rule -->
  <rect x="226" y="170" width="500" height="10" fill="#1877F2" opacity=".75"/>
  <path d="M595 170 V266 Q595 298 628 298 H724Z" fill="#B9DFF0"/>
  <!-- Facebook avatar tile -->
  <rect x="292" y="238" width="98" height="98" rx="23" fill="url(#fbblue)"/>
  <path d="M346 307 V281 H335 V268 H346 V258 Q346 244 362 244 H375 V258 H366 Q361 258 361 263 V268 H376 L374 281 H361 V307Z" fill="white" transform="translate(-4 2) scale(1.1) translate(-34 -27)"/>
  <!-- strong title / meta -->
  <rect x="417" y="249" width="126" height="21" rx="10.5" fill="#1B507A"/>
  <rect x="417" y="286" width="179" height="16" rx="8" fill="#8EB7D3"/>
  <!-- post body lines -->
  <rect x="296" y="383" width="312" height="22" rx="11" fill="#88AFCA"/>
  <rect x="296" y="426" width="288" height="21" rx="10.5" fill="#A5C4D8"/>
  <rect x="296" y="469" width="205" height="21" rx="10.5" fill="#A5C4D8"/>
  <!-- small social reactions -->
  <circle cx="314" cy="570" r="17" fill="#1977F3"/>
  <path d="M306 574 h5 v-10 c0-6 9-6 9 0 v1 h5 v5 h-5 v4 h-14" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="354" cy="570" r="17" fill="#FFC756"/>
  <path d="M347 569 q7 -9 14 0 q-6 11 -14 0" fill="#fff1c1"/>
  <rect x="385" y="565" width="142" height="12" rx="6" fill="#C3D9E9"/>
</g>
<!-- magnifier handle behind lens, angled toward lower right -->
<path d="M676 692 L845 862" stroke="#09253A" stroke-width="111" stroke-linecap="round" opacity=".55" filter="url(#handleShadow)"/>
<path d="M675 685 L831 842" stroke="#0A4663" stroke-width="93" stroke-linecap="round"/>
<path d="M686 700 L818 832" stroke="url(#gold)" stroke-width="79" stroke-linecap="round"/>
<path d="M733 744 L820 833" stroke="#FFE7A5" stroke-width="13" stroke-linecap="round" opacity=".8"/>
<!-- magnifier white bezel and blue glass -->
<circle cx="567" cy="551" r="201" fill="#0E2845" opacity=".15" transform="translate(8 9)"/>
<circle cx="567" cy="551" r="194" fill="#F4FBFF"/>
<circle cx="567" cy="551" r="166" fill="url(#lens)"/>
<circle cx="567" cy="551" r="150" fill="none" stroke="#64C8F2" stroke-width="3" opacity=".25"/>
<!-- glass gleam -->
<path d="M465 464 A146 146 0 0 1 552 409" stroke="#8FDFFC" stroke-width="11" stroke-linecap="round" opacity=".36" fill="none"/>
<!-- Semantic graph in glass, subtly present behind facebook f -->
<path d="M488 611 L615 492 L664 600 L522 666Z" fill="none" stroke="#92D8EF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".69"/>
<circle cx="488" cy="611" r="16" fill="#FFCC6A"/>
<circle cx="615" cy="492" r="15" fill="#FFCC6A"/>
<circle cx="664" cy="600" r="17" fill="#FFCC6A"/>
<circle cx="522" cy="666" r="14" fill="#FFCC6A"/>
<!-- dominant, high-contrast f, center glass -->
<path d="M560 679 V562 H528 V523 H560 V501 C560 458 585 433 628 433 H655 V470 H630 Q606 470 606 495 V523 H655 L649 562 H606 V679Z" fill="#0E4A86" opacity=".25" transform="translate(8 9)"/>
<path d="M560 679 V562 H528 V523 H560 V501 C560 458 585 433 628 433 H655 V470 H630 Q606 470 606 495 V523 H655 L649 562 H606 V679Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
</svg>