name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No package-lock.json is checked in yet; migrate to npm ci after adding it.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker source
        run: npm run typecheck
      - name: Run offline tests
        run: npm test
      - name: Test workers.dev onboarding logic
        run: python3 -m unittest discover -s scripts -p 'test_workers_dev_subdomain.py'
